<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz Adventure — EduRush</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f1df;
      color: #222;
    }

    .site-header {
      padding: 18px 6%;
      background: white;
      border-bottom: 3px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #222;
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
    }

    .logo-mark {
      display: inline-flex;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      background: #ffd166;
      border: 3px solid #222;
      border-radius: 12px;
      margin-right: 8px;
    }

    .wrap {
      width: min(1100px, 92%);
      margin: 30px auto;
    }

    .kicker {
      font-weight: 900;
      margin-bottom: 5px;
    }

    .section-title {
      font-size: 38px;
      margin-top: 0;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .stat {
      background: white;
      border: 3px solid #222;
      border-radius: 18px;
      padding: 14px;
      text-align: center;
    }

    .stat b {
      display: block;
      font-size: 28px;
    }

    .stat span {
      font-weight: 700;
    }

    .timer-bar {
      height: 14px;
      background: #ddd;
      border: 3px solid #222;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .timer-bar span {
      display: block;
      width: 100%;
      height: 100%;
      background: #ffb703;
      transform-origin: left;
    }

    .hidden {
      display: none;
    }

    .play-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .preview-stage {
      min-height: 500px;
      background: #dff3ff;
      border: 4px solid #222;
      border-radius: 28px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .preview-stage::before {
      content: "🌳     ☁️        🏔️";
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      font-size: 30px;
      text-align: center;
    }

    .preview-stage::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 110px;
      background: #b7e4c7;
      border-top: 3px solid #222;
      z-index: 0;
    }

    .preview-stage > * {
      position: relative;
      z-index: 2;
    }

    .avatar-name {
      background: white;
      border: 3px solid #222;
      border-radius: 12px;
      padding: 8px 14px;
      font-weight: 900;
      margin-top: 10px;
    }

    .adventure-label {
      position: absolute;
      top: 70px;
      left: 20px;
      right: 20px;
      background: #fff;
      border: 3px solid #222;
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      font-weight: 900;
    }

    .play-board {
      background: white;
      border: 4px solid #222;
      border-radius: 28px;
      padding: 28px;
    }

    .quiz-card {
      width: 100%;
    }

    .question-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stage-badge,
    .question-count {
      background: #ffd166;
      border: 3px solid #222;
      border-radius: 12px;
      padding: 8px 12px;
      font-weight: 900;
    }

    .question-count {
      background: #eee;
    }

    .question {
      font-size: 26px;
      line-height: 1.35;
      font-weight: 900;
    }

    .options {
      display: grid;
      gap: 12px;
      margin-top: 25px;
    }

    button.option {
      width: 100%;
      padding: 16px;
      background: #fff;
      border: 3px solid #222;
      border-radius: 16px;
      text-align: left;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: .15s;
    }

    button.option:hover {
      transform: translateY(-3px);
      background: #fff4c2;
    }

    button.option.correct {
      background: #b7e4c7;
    }

    button.option.wrong {
      background: #ffccd5;
    }

    button.option:disabled {
      cursor: default;
    }

    .feedback {
      min-height: 30px;
      margin-top: 18px;
      font-weight: 900;
      font-size: 17px;
    }

    .adventure-result {
      text-align: center;
      padding: 25px;
    }

    .result-icon {
      font-size: 70px;
    }

    .adventure-result h2 {
      font-size: 36px;
    }

    .final-score {
      font-size: 55px;
      font-weight: 900;
      margin: 10px;
    }

    .result-button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 22px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 15px;
      font-weight: 900;
    }

    @media (max-width: 750px) {
      .play-layout {
        grid-template-columns: 1fr;
      }

      .preview-stage {
        min-height: 320px;
      }

      .question {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<header class="site-header">

  <a class="logo" href="index.html">
    <span class="logo-mark">ER</span>
    EduRush
  </a>

  <div class="header-meta" data-setup-pills></div>

</header>


<main id="main" class="wrap">

  <p class="kicker" id="game-kicker">
    🗺️ PETUALANGAN
  </p>

  <h1 class="section-title" id="game-title">
    Quiz Adventure
  </h1>

  <div id="notice"></div>


  <div class="hud">

    <div class="stat">
      <b id="stat-score">0</b>
      <span>⭐ Skor</span>
    </div>

    <div class="stat">
      <b id="stat-progress">0/0</b>
      <span>🗺️ Stage</span>
    </div>

    <div class="stat">
      <b id="stat-streak">0</b>
      <span>🔥 Streak</span>
    </div>

  </div>


  <div id="timer-wrap" class="timer-bar">
    <span id="timer-fill"></span>
  </div>


  <div class="play-layout">

    <aside
      class="preview-stage"
      id="avatar-stage"
    >

      <div class="adventure-label">
        🧭 Petualangan EduRush
      </div>

    </aside>


    <section
      class="play-board"
      id="board"
    ></section>

  </div>

</main>


<script src="js/avatar.js"></script>
<script src="js/app.js"></script>
<script src="js/questions.js"></script>
<script src="js/question-bank.js"></script>
<script src="js/scoring.js"></script>
<script src="js/quiz-rush.js"></script>
<script src="js/true-false.js"></script>
<script src="js/match.js"></script>
<script src="js/order.js"></script>


<script>

const avatar =
  EduRushAvatar.requireAvatar();

const setup =
  EduRush.requireSetup();


if (!setup || !avatar) {

  throw new Error(
    "Avatar dan setup diperlukan."
  );

}


EduRush.renderSetupPills(
  document.querySelector(
    "[data-setup-pills]"
  )
);


const stage =
  document.getElementById(
    "avatar-stage"
  );


EduRushAvatar.renderAvatar(
  stage,
  avatar,
  180
);


const nameTag =
  document.createElement("p");

nameTag.className =
  "avatar-name";

nameTag.textContent =
  avatar.name;

stage.appendChild(
  nameTag
);


EduRushAvatar.setAvatarMood(
  stage,
  "idle"
);


const params =
  new URLSearchParams(
    location.search
  );


const game =
  EduRush.getGame(
    setup.jenjang,
    params.get("game")
  );


const board =
  document.getElementById(
    "board"
  );


const notice =
  document.getElementById(
    "notice"
  );


function hud(
  state,
  index,
  total
) {

  document.getElementById(
    "stat-score"
  ).textContent =
    state.score;

  document.getElementById(
    "stat-streak"
  ).textContent =
    state.streak;

  document.getElementById(
    "stat-progress"
  ).textContent =
    `${Math.min(index, total)}/${total}`;

}


if (!game) {

  notice.innerHTML = `
    <div class="notice">
      Game tidak ditemukan.
      <br>
      <a href="games.html">
        Kembali ke lobby
      </a>
    </div>
  `;

} else {

  document.getElementById(
    "game-title"
  ).textContent =
    game.name;


  document.getElementById(
    "game-kicker"
  ).textContent =
    `🗺️ ${EduRush.WORLDS[setup.jenjang].vibe} · ${EduRush.LABELS.mapel[setup.mapel]}`;


  EduRushQuestions
    .loadQuestionBank()
    .then((bank) => {

      const questions =
        EduRushQuestions.getQuestions(
          bank,
          {
            jenjang:
              setup.jenjang,

            mapel:
              setup.mapel,

            tipe:
              game.tipe,

            limit:
              game.limit
          }
        );


      if (
        questions.length === 0
      ) {

        notice.innerHTML = `
          <div class="notice">
            Belum ada soal untuk pilihanmu.
            <br><br>
            <a href="games.html">
              Kembali ke mini-game
            </a>
          </div>
        `;

        return;

      }


      const starters = {

        "quiz-rush":
          window.startQuizRush,

        "true-false":
          window.startTrueFalse,

        "match":
          window.startMatch,

        "order":
          window.startOrder

      };


      const startGame =
        starters[game.id];


      if (
        typeof startGame !==
        "function"
      ) {

        notice.innerHTML = `
          <div class="notice">
            Game belum siap.
          </div>
        `;

        return;

      }


      startGame({

        questions,
        setup,
        game,
        board,
        hud,
        stage

      });

    })


    .catch((error) => {

      console.error(error);

      notice.innerHTML = `
        <div class="notice">
          Bank soal belum bisa dimuat.
          <br><br>
          Pastikan file soal tersedia.
        </div>
      `;

    });

}

</script>

</body>
</html>
