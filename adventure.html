<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>World Adventure — EduRush</title>

  <!-- THREE.JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- SISTEM AVATAR EDURUSH -->
  <script src="js/avatar.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #bfe9ff;
    }

    body {
      touch-action: none;
    }

    /* =====================================================
       GAME
    ===================================================== */

    .game {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #bfe9ff;
    }

    /* =====================================================
       WORLD
    ===================================================== */

    .world {
      position: absolute;
      width: 2400px;
      height: 1500px;
      left: 0;
      top: 0;

      transform-origin: top left;

      transition: transform 0.05s linear;
    }

    /* =====================================================
       SKY
    ===================================================== */

    .sky {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          #8ed8ff 0%,
          #bdeaff 48%,
          #e5f8ff 100%
        );
    }

    /* =====================================================
       CLOUDS
    ===================================================== */

    .cloud {
      position: absolute;
      width: 180px;
      height: 65px;
      background: white;
      border-radius: 100px;
      opacity: .85;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    .cloud::before {
      width: 75px;
      height: 75px;
      left: 30px;
      top: -30px;
    }

    .cloud::after {
      width: 95px;
      height: 95px;
      right: 25px;
      top: -45px;
    }

    .cloud-1 {
      left: 250px;
      top: 150px;
    }

    .cloud-2 {
      left: 1000px;
      top: 180px;
      transform: scale(.75);
    }

    .cloud-3 {
      left: 1750px;
      top: 120px;
      transform: scale(.9);
    }

    .cloud-4 {
      left: 2050px;
      top: 350px;
      transform: scale(.6);
    }

    /* =====================================================
       GROUND
    ===================================================== */

    .ground {
      position: absolute;
      left: 0;
      top: 570px;
      width: 2400px;
      height: 930px;

      background:
        radial-gradient(
          circle at 20px 20px,
          rgba(255,255,255,.13) 0 4px,
          transparent 5px
        ),
        linear-gradient(
          #75c96b,
          #58b958
        );

      background-size:
        90px 90px,
        100% 100%;
    }

    /* =====================================================
       ROAD
    ===================================================== */

    .road {
      position: absolute;
      left: 0;
      top: 815px;
      width: 2400px;
      height: 170px;

      background: #d5c59f;

      border-top: 8px solid rgba(255,255,255,.45);
      border-bottom: 8px solid rgba(255,255,255,.3);

      transform: rotate(-2deg);
      transform-origin: center;
    }

    .road::after {
      content: "";
      position: absolute;
      left: 0;
      top: 75px;
      width: 2400px;
      height: 12px;

      background:
        repeating-linear-gradient(
          to right,
          #fff3b0 0 70px,
          transparent 70px 120px
        );

      opacity: .9;
    }

    /* =====================================================
       TREES
    ===================================================== */

    .tree {
      position: absolute;
      width: 100px;
      height: 150px;
      z-index: 4;
    }

    .tree::before {
      content: "";
      position: absolute;
      left: 42px;
      top: 70px;
      width: 25px;
      height: 80px;
      border-radius: 10px;
      background: #87562f;
    }

    .tree::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 0;
      width: 90px;
      height: 95px;
      border-radius: 50%;
      background: #23894b;
      box-shadow:
        35px 25px 0 #2e9a53,
        -20px 30px 0 #2b9650;
    }

    .tree-1 {
      left: 130px;
      top: 680px;
    }

    .tree-2 {
      left: 620px;
      top: 1020px;
      transform: scale(.8);
    }

    .tree-3 {
      left: 1120px;
      top: 650px;
      transform: scale(1.15);
    }

    .tree-4 {
      left: 1600px;
      top: 1020px;
      transform: scale(.9);
    }

    .tree-5 {
      left: 2150px;
      top: 670px;
      transform: scale(1.2);
    }

    /* =====================================================
       LOCATION
    ===================================================== */

    .location {
      position: absolute;
      width: 210px;
      min-height: 125px;

      padding: 18px;

      border-radius: 25px;

      background: rgba(255,255,255,.94);

      box-shadow:
        0 12px 30px rgba(0,0,0,.18);

      text-align: center;

      z-index: 8;

      transform: translate(-50%, -50%);

      cursor: pointer;

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .location:hover {
      transform:
        translate(-50%, -50%)
        scale(1.05);

      box-shadow:
        0 18px 35px rgba(0,0,0,.23);
    }

    .location-icon {
      font-size: 38px;
      margin-bottom: 5px;
    }

    .location-name {
      font-weight: 900;
      font-size: 17px;
      color: #174f35;
    }

    .location-desc {
      margin-top: 4px;
      font-size: 12px;
      color: #65756b;
    }

    .location-badge {
      display: inline-block;
      margin-top: 9px;
      padding: 5px 10px;

      border-radius: 999px;

      background: #e9f8ee;
      color: #18834c;

      font-size: 11px;
      font-weight: 800;
    }

    /* =====================================================
       AVATAR CONTAINER
       Avatar 3D dibuat oleh avatar.js
    ===================================================== */

    .avatar {
      position: absolute;

      width: 110px;
      height: 130px;

      z-index: 20;

      transform:
        translate(-50%, -100%);

      pointer-events: none;

      overflow: visible;
    }

    .avatar canvas {
      display: block;

      width: 100% !important;
      height: 100% !important;

      pointer-events: none;
    }

    /* =====================================================
       PLAYER SHADOW
    ===================================================== */

    .player-shadow {
      position: absolute;

      width: 75px;
      height: 22px;

      border-radius: 50%;

      background: rgba(0,0,0,.2);

      transform:
        translate(-50%, -50%);

      z-index: 10;

      pointer-events: none;
    }

    /* =====================================================
       HUD
    ===================================================== */

    .hud {
      position: fixed;
      left: 20px;
      top: 20px;

      z-index: 100;

      display: flex;
      gap: 12px;
      align-items: center;
    }

    .hud-card {
      min-width: 150px;

      padding: 12px 16px;

      border-radius: 18px;

      background: rgba(255,255,255,.95);

      box-shadow:
        0 8px 25px rgba(0,0,0,.15);
    }

    .hud-title {
      font-size: 11px;
      color: #6b7c72;
      font-weight: 800;
      text-transform: uppercase;
    }

    .hud-value {
      margin-top: 3px;

      font-size: 22px;
      font-weight: 900;

      color: #147445;
    }

    /* =====================================================
       PLAYER INFO
    ===================================================== */

    .player-info {
      position: fixed;

      right: 20px;
      top: 20px;

      z-index: 100;

      display: flex;
      align-items: center;
      gap: 12px;

      padding: 12px 16px;

      border-radius: 20px;

      background: rgba(255,255,255,.95);

      box-shadow:
        0 8px 25px rgba(0,0,0,.15);
    }

    .mini-avatar {
      width: 45px;
      height: 45px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background: #eaf6ef;

      font-size: 27px;
    }

    .player-name {
      font-weight: 900;
      color: #174f35;
    }

    .player-level {
      margin-top: 2px;

      font-size: 12px;
      color: #718077;
    }

    /* =====================================================
       JOYSTICK
    ===================================================== */

    .controls {
      position: fixed;

      left: 30px;
      bottom: 30px;

      z-index: 100;

      display: flex;
      align-items: center;
      gap: 25px;
    }

    .joystick {
      position: relative;

      width: 145px;
      height: 145px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.45);

      border:
        4px solid rgba(255,255,255,.75);

      box-shadow:
        0 10px 30px rgba(0,0,0,.18);

      backdrop-filter: blur(8px);

      touch-action: none;
    }

    .joystick-stick {
      position: absolute;

      width: 65px;
      height: 65px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background: #ffffff;

      box-shadow:
        0 8px 20px rgba(0,0,0,.2);

      transition:
        transform .08s linear;
    }

    /* =====================================================
       INTERACT BUTTON
    ===================================================== */

    .interact {
      min-width: 135px;
      min-height: 55px;

      border: none;

      border-radius: 18px;

      background: #ffc928;

      color: #604700;

      font-size: 15px;
      font-weight: 900;

      box-shadow:
        0 8px 20px rgba(0,0,0,.18);

      cursor: pointer;

      transition:
        transform .15s ease;
    }

    .interact:hover {
      transform: translateY(-3px);
    }

    .interact:active {
      transform: translateY(1px);
    }

    .interact.disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* =====================================================
       CHALLENGE MODAL
    ===================================================== */

    .modal {
      position: fixed;

      inset: 0;

      z-index: 300;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(11,40,25,.55);

      backdrop-filter: blur(7px);
    }

    .modal.show {
      display: flex;
    }

    .challenge {
      width: min(540px, 95vw);

      padding: 30px;

      border-radius: 28px;

      background: white;

      box-shadow:
        0 25px 70px rgba(0,0,0,.3);

      animation:
        pop .2s ease;
    }

    @keyframes pop {
      from {
        transform: scale(.9);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .challenge-location {
      color: #15904f;

      font-size: 13px;
      font-weight: 900;

      text-transform: uppercase;
    }

    .challenge h2 {
      margin: 8px 0 20px;

      color: #173e2b;

      font-size: 26px;
    }

    .question {
      padding: 20px;

      border-radius: 18px;

      background: #f5faf6;

      color: #244b38;

      font-size: 18px;
      font-weight: 800;

      line-height: 1.5;
    }

    .answers {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

      margin-top: 18px;
    }

    .answer {
      min-height: 58px;

      border:
        2px solid #dcebe2;

      border-radius: 15px;

      background: white;

      color: #27543e;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;

      transition:
        .15s ease;
    }

    .answer:hover {
      transform: translateY(-2px);

      border-color: #62bb83;

      background: #f0faf4;
    }

    .answer.correct {
      border-color: #31a866;
      background: #dff7e8;
      color: #16723f;
    }

    .answer.wrong {
      border-color: #dc6d6d;
      background: #ffe7e7;
      color: #a83a3a;
    }

    .close-modal {
      width: 100%;

      margin-top: 18px;

      padding: 13px;

      border: none;

      border-radius: 14px;

      background: #edf3ef;

      color: #426052;

      font-weight: 800;

      cursor: pointer;
    }

    /* =====================================================
       NOTIFICATION
    ===================================================== */

    .toast {
      position: fixed;

      left: 50%;
      top: 90px;

      z-index: 400;

      transform:
        translateX(-50%)
        translateY(-20px);

      opacity: 0;

      pointer-events: none;

      padding: 13px 20px;

      border-radius: 999px;

      background: white;

      color: #185a38;

      font-weight: 900;

      box-shadow:
        0 10px 30px rgba(0,0,0,.18);

      transition:
        .25s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 700px) {

      .hud {
        left: 10px;
        top: 10px;
      }

      .hud-card {
        min-width: 105px;
        padding: 9px 11px;
      }

      .hud-value {
        font-size: 18px;
      }

      .player-info {
        right: 10px;
        top: 10px;

        padding: 9px 11px;
      }

      .mini-avatar {
        width: 38px;
        height: 38px;
        font-size: 22px;
      }

      .player-name {
        font-size: 13px;
      }

      .player-level {
        font-size: 10px;
      }

      .controls {
        left: 15px;
        bottom: 15px;

        gap: 12px;
      }

      .joystick {
        width: 120px;
        height: 120px;
      }

      .joystick-stick {
        width: 55px;
        height: 55px;
      }

      .interact {
        min-width: 110px;
        min-height: 50px;
      }

      .answers {
        grid-template-columns: 1fr;
      }

      .challenge {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="game">

    <!-- ===================================================
         WORLD
    ==================================================== -->

    <div class="world" id="world">

      <div class="sky"></div>

      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>

      <div class="ground"></div>

      <div class="road"></div>

      <div class="tree tree-1"></div>
      <div class="tree tree-2"></div>
      <div class="tree tree-3"></div>
      <div class="tree tree-4"></div>
      <div class="tree tree-5"></div>

      <!-- =================================================

      ================================================== -->

      <div
        class="location"

        </div>

        </div>
      </div>


      <div

        data-x="915"

      >
        <div class="location-icon">🌲</div>

        <div class="location-name">

        </div>

        <div class="location-desc">

        </div>

        <div class="location-badge">

        </div>
      </div>


      <div
        class="location"
        data-x="1415"

        data-name="Knowledge Castle"
      >
        <div class="location-icon">🏰</div>

        <div class="location-name">
          Knowledge Castle
        </div>

        <div class="location-desc">

        </div>

        <div class="location-badge">

        </div>
      </div>


      <div
        class="location"
        data-x="1915"
        data-y="860"
        data-name="Final Gate"
      >
        <div class="location-icon">🚪</div>

        <div class="location-name">

      <!-- =================================================

      ================================================== -->

      <div
        class="player-shadow"

      ></div>


      <!-- =================================================
           AVATAR
           ISINYA KOSONG.
           AVATAR DIBUAT OLEH avatar.js
      ================================================== -->

      <div
        class="avatar"

      ></div>

    </div>


    <!-- ===================================================

    ==================================================== -->

    <div class="hud">

      <div class="hud-card">

        <div class="hud-title">
          XP
        </div>

        <div
          class="hud-value"
          id="xp"
        >

        </div>

      </div>


      <div class="hud-card">

        <div class="hud-title">

        </div>

        <div
          class="hud-value"
          id="area"
        >

        </div>

      </div>

    <!-- ===================================================

    ==================================================== -->

    <div class="player-info">

      <div class="mini-avatar">
        🧑🏻
      </div>

      <div>

        <div class="player-name">

        </div>

        </div>

    <!-- ===================================================

    ==================================================== -->

    <div class="controls">

      <div
        class="joystick"

      >

        <div
          class="joystick-stick"

        class="interact"

    <!-- ===================================================

    ==================================================== -->

    <div
      class="toast"
      id="toast"
    ></div>


    <!-- ===================================================
         CHALLENGE MODAL
    ==================================================== -->

    <div
      class="modal"
      id="modal"
    >

      <div class="challenge">

        <div
          class="challenge-location"
          id="challengeLocation"
        >

        </div>

          Tantangan!
        </h2>

        <div
          class="question"
          id="question"
        ></div>

        <div
          class="answers"
          id="answers"

          class="close-modal"

          Kembali ke petualangan
        </button>

  </div>


  <script>

    /* =====================================================
       ELEMENT
    ===================================================== */

    const world =
      document.getElementById("world");

    const avatar =
      document.getElementById("avatar");

    const playerShadow =
      document.getElementById("playerShadow");

    const joystick =
      document.getElementById("joystick");

    const joystickStick =
      document.getElementById("joystickStick");

    const interact =
      document.getElementById("interact");

    const xpEl =
      document.getElementById("xp");

    const areaEl =
      document.getElementById("area");

    const modal =
      document.getElementById("modal");

    const questionEl =
      document.getElementById("question");

    const answersEl =
      document.getElementById("answers");

    const challengeLocation =
      document.getElementById("challengeLocation");

    const closeModal =
      document.getElementById("closeModal");

    const toast =
      document.getElementById("toast");


    /* =====================================================
       PLAYER
    ===================================================== */

    const player = {

      x: 420,
      y: 790,

      speed: 4.5,

      moving: false

    };


    let camera = {
      x: 0,
      y: 0
    };


    let xp = 0;

    let currentArea = 1;

    let activeLocation = null;


    /* =====================================================
       JOYSTICK STATE
    ===================================================== */

    const joystickState = {

      active: false,

      x: 0,
      y: 0

    };


    /* =====================================================
       CHALLENGES
    ===================================================== */

    const challenges = {

      "Camp Base": {

        question:
          "Planet tempat kita tinggal adalah...",

        answers: [
          "Mars",
          "Bumi",
          "Jupiter",
          "Venus"
        ],

        correct:
          "Bumi"

      },


      "Mystic Forest": {

        question:
          "Berapakah hasil dari 8 × 7?",

        answers: [
          "54",
          "56",
          "64",
          "48"
        ],

        correct:
          "56"

      },


      "Knowledge Castle": {

        question:
          "Perubahan air menjadi uap disebut...",

        answers: [
          "Pembekuan",
          "Pengembunan",
          "Penguapan",
          "Pencairan"
        ],

        correct:
          "Penguapan"

      },


      "Final Gate": {

        question:
          "Bagian tumbuhan yang menyerap air dan mineral dari tanah adalah...",

        answers: [
          "Daun",
          "Batang",
          "Bunga",
          "Akar"
        ],

        correct:
          "Akar"

      }

    };


    /* =====================================================
       POSITION AVATAR
    ===================================================== */

    function updateAvatar() {

      avatar.style.left =
        player.x + "px";

      avatar.style.top =
        player.y + "px";


      playerShadow.style.left =
        player.x + "px";

      playerShadow.style.top =
        (player.y + 8) + "px";

    }


    /* =====================================================
       CAMERA
    ===================================================== */

    function updateCamera() {

      const screenWidth =
        window.innerWidth;

      const screenHeight =
        window.innerHeight;


      const maxCameraX =
        Math.max(
          0,
          2400 - screenWidth
        );

      const maxCameraY =
        Math.max(
          0,
          1500 - screenHeight
        );


      let targetX =
        player.x -
        screenWidth / 2;

      let targetY =
        player.y -
        screenHeight / 2;


      targetX =
        Math.max(
          0,
          Math.min(
            targetX,
            maxCameraX
          )
        );


      targetY =
        Math.max(
          0,
          Math.min(
            targetY,
            maxCameraY
          )
        );


      camera.x =
        targetX;

      camera.y =
        targetY;


      world.style.transform =
        `translate(${-camera.x}px, ${-camera.y}px)`;

    }


    /* =====================================================
       MOVE PLAYER
    ===================================================== */

    function movePlayer() {

      let dx =
        joystickState.x;

      let dy =
        joystickState.y;


      if (
        Math.abs(dx) < .05 &&
        Math.abs(dy) < .05
      ) {

        player.moving = false;

        return;

      }


      player.moving = true;


      const length =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if (length > 1) {

        dx /= length;
        dy /= length;

      }


      player.x +=
        dx * player.speed;

      player.y +=
        dy * player.speed;


      /* BATAS WORLD */

      player.x =
        Math.max(
          100,
          Math.min(
            2300,
            player.x
          )
        );


      player.y =
        Math.max(
          620,
          Math.min(
            1400,
            player.y
          )
        );


      updateAvatar();

      updateCamera();

    }


    /* =====================================================
       GAME LOOP
    ===================================================== */

    function gameLoop() {

      movePlayer();

      requestAnimationFrame(
        gameLoop
      );

    }


    /* =====================================================
       JOYSTICK
    ===================================================== */

    function setJoystick(
      clientX,
      clientY
    ) {

      const rect =
        joystick.getBoundingClientRect();


      const centerX =
        rect.left +
        rect.width / 2;

      const centerY =
        rect.top +
        rect.height / 2;


      let dx =
        clientX - centerX;

      let dy =
        clientY - centerY;


      const max =
        rect.width / 2 - 34;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if (distance > max) {

        dx =
          dx / distance * max;

        dy =
          dy / distance * max;

      }


      joystickState.x =
        dx / max;

      joystickState.y =
        dy / max;


      joystickStick.style.transform =
        `translate(
          calc(-50% + ${dx}px),
          calc(-50% + ${dy}px)
        )`;

    }


    function resetJoystick() {

      joystickState.x = 0;
      joystickState.y = 0;

      joystickStick.style.transform =
        "translate(-50%, -50%)";

      joystickState.active =
        false;

    }


    joystick.addEventListener(
      "pointerdown",
      event => {

        joystickState.active =
          true;

        joystick.setPointerCapture(
          event.pointerId
        );

        setJoystick(
          event.clientX,
          event.clientY
        );

      }
    );


    joystick.addEventListener(
      "pointermove",
      event => {

        if (
          !joystickState.active
        ) return;

        setJoystick(
          event.clientX,
          event.clientY
        );

      }
    );


    joystick.addEventListener(
      "pointerup",
      resetJoystick
    );


    joystick.addEventListener(
      "pointercancel",
      resetJoystick
    );


    /* =====================================================
       KEYBOARD
    ===================================================== */

    const keys = {};


    window.addEventListener(
      "keydown",
      event => {

        keys[event.key.toLowerCase()] =
          true;

        let dx = 0;
        let dy = 0;


        if (
          keys["w"] ||
          keys["arrowup"]
        ) {

          dy -= 1;

        }


        if (
          keys["s"] ||
          keys["arrowdown"]
        ) {

          dy += 1;

        }


        if (
          keys["a"] ||
          keys["arrowleft"]
        ) {

          dx -= 1;

        }


        if (
          keys["d"] ||
          keys["arrowright"]
        ) {

          dx += 1;

        }


        joystickState.x = dx;
        joystickState.y = dy;

      }
    );


    window.addEventListener(
      "keyup",
      event => {

        keys[event.key.toLowerCase()] =
          false;


        let dx = 0;
        let dy = 0;


        if (
          keys["w"] ||
          keys["arrowup"]
        ) {

          dy -= 1;

        }


        if (
          keys["s"] ||
          keys["arrowdown"]
        ) {

          dy += 1;

        }


        if (
          keys["a"] ||
          keys["arrowleft"]
        ) {

          dx -= 1;

        }


        if (
          keys["d"] ||
          keys["arrowright"]
        ) {

          dx += 1;

        }


        joystickState.x = dx;
        joystickState.y = dy;

      }
    );


    /* =====================================================
       FIND NEAREST LOCATION
    ===================================================== */

    function getNearestLocation() {

      const locations =
        document.querySelectorAll(
          ".location"
        );


      let nearest = null;

      let nearestDistance =
        Infinity;


      locations.forEach(
        location => {

          const x =
            Number(
              location.dataset.x
            );

          const y =
            Number(
              location.dataset.y
            );


          const dx =
            player.x - x;

          const dy =
            player.y - y;


          const distance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );


          if (
            distance <
            nearestDistance
          ) {

            nearestDistance =
              distance;

            nearest =
              location;

          }

        }
      );


      return {
        location: nearest,
        distance: nearestDistance
      };

    }


    /* =====================================================
       INTERACT
    ===================================================== */

    function checkInteraction() {

      const result =
        getNearestLocation();


      if (
        result.location &&
        result.distance < 170
      ) {

        activeLocation =
          result.location.dataset.name;

        openChallenge(
          activeLocation
        );

      } else {

        showToast(
          "Dekati lokasi challenge dulu! 🗺️"
        );

      }

    }


    interact.addEventListener(
      "click",
      checkInteraction
    );


    /* =====================================================
       LOCATION CLICK
    ===================================================== */

    document
      .querySelectorAll(".location")
      .forEach(location => {

        location.addEventListener(
          "click",
          () => {

            const x =
              Number(
                location.dataset.x
              );

            const y =
              Number(
                location.dataset.y
              );


            const distance =
              Math.sqrt(
                (player.x - x) ** 2 +
                (player.y - y) ** 2
              );


            if (distance < 220) {

              activeLocation =
                location.dataset.name;

              openChallenge(
                activeLocation
              );

            } else {

              showToast(
                "Jalan sedikit lebih dekat dulu 👣"
              );

            }

          }
        );

      });


    /* =====================================================
       OPEN CHALLENGE
    ===================================================== */

    function openChallenge(
      locationName
    ) {

      const challenge =
        challenges[locationName];


      if (!challenge) return;


      challengeLocation.textContent =
        locationName;


      questionEl.textContent =
        challenge.question;


      answersEl.innerHTML = "";


      challenge.answers.forEach(
        answer => {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "answer";

          button.textContent =
            answer;


          button.addEventListener(
            "click",
            () => {

              answerQuestion(
                button,
                answer,
                challenge.correct
              );

            }
          );


          answersEl.appendChild(
            button
          );

        }
      );


      modal.classList.add(
        "show"
      );

    }


    /* =====================================================
       ANSWER
    ===================================================== */

    function answerQuestion(
      button,
      answer,
      correct
    ) {

      const buttons =
        answersEl.querySelectorAll(
          ".answer"
        );


      buttons.forEach(
        btn => {

          btn.disabled = true;

        }
      );


      if (answer === correct) {

        button.classList.add(
          "correct"
        );


        xp += 50;

        xpEl.textContent =
          xp;


        currentArea =
          Math.min(
            4,
            currentArea + 1
          );


        areaEl.textContent =
          `${currentArea} / 4`;


        showToast(
          "+50 XP! Jawaban benar 🎉"
        );


      } else {

        button.classList.add(
          "wrong"
        );


        buttons.forEach(
          btn => {

            if (
              btn.textContent ===
              correct
            ) {

              btn.classList.add(
                "correct"
              );

            }

          }
        );


        showToast(
          "Belum benar, coba lagi 💪"
        );

      }

    }


    /* =====================================================
       CLOSE MODAL
    ===================================================== */

    closeModal.addEventListener(
      "click",
      () => {

        modal.classList.remove(
          "show"
        );

      }
    );


    /* =====================================================
       TOAST
    ===================================================== */

    let toastTimer;


    function showToast(
      message
    ) {

      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          2200
        );

    }


    /* =====================================================
       LOAD AVATAR DARI CHARACTER CREATOR
    ===================================================== */

    if (
      window.EduRushAvatar &&
      typeof EduRushAvatar.mount ===
        "function"
    ) {

      EduRushAvatar.mount(
        "#avatar"
      );

    } else {

      console.error(
        "EduRushAvatar tidak ditemukan. Pastikan js/avatar.js sudah benar."
      );

    }


    /* =====================================================
       INITIALIZE
    ===================================================== */

    updateAvatar();

    updateCamera();

    gameLoop();

  </script>

</body>
</html>
