<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Latihan — EduRush</title>

  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/latihan.css">
</head>

<body>

  <!-- =====================================================
       NAVBAR
       ===================================================== -->

  <header class="navbar">

    <div class="nav-container">

      <a href="index.html" class="logo">

        <span class="logo-mark">ER </span>

        <span>
          Edu<span>Rush</span>
        </span>

      </a>

      <nav class="nav-menu">

        <a href="index.html">
          Beranda
        </a>

        <a href="index.html#tentang">
          Tentang
        </a>

      </nav>

    </div>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main>


    <!-- ===================================================
         HEADER LATIHAN
         =================================================== -->

    <section class="practice-header">

      <div class="practice-header-inner">

        <a href="materi.html" class="back-link">
          <span>←</span>
          Pilih materi lain
        </a>


        <div class="practice-heading">

          <div class="practice-heading-text">

            <h1 id="practice-title">
              Latihan Matematika
            </h1>

            <p id="practice-description">
              Yuk, coba beberapa soal sederhana sebelum masuk ke kuis.
            </p>

          </div>

        </div>

      </div>

    </section>



    <!-- ===================================================
         LATIHAN CARD
         =================================================== -->

    <section class="practice-section">

      <div class="practice-card">


        <!-- TOP -->

        <div class="practice-top">

          <div class="question-count">

            <span
              class="practice-number"
              id="practice-number">
              01
            </span>

            <span
              class="practice-total"
              id="practice-total">
              / 03
            </span>

          </div>


          <span
            class="practice-status"
            id="practice-status">
            LATIHAN
          </span>

        </div>



        <!-- PROGRESS -->

        <div class="practice-progress">

          <div class="progress-bar">

            <span id="progress-fill"></span>

          </div>

        </div>



        <!-- VISUAL SOAL -->

        <div
          class="practice-visual"
          id="practice-visual">
        </div>



        <!-- PERTANYAAN -->

        <div class="question-area">

          <span class="question-label">
            PERTANYAAN
          </span>

          <h2 id="practice-question">
            Soal latihan
          </h2>

        </div>



        <!-- PILIHAN -->

        <div
          class="practice-options"
          id="practice-options">
        </div>



        <!-- FEEDBACK -->

        <div
          class="practice-feedback"
          id="practice-feedback">

          <span id="feedback-icon">
            ✓
          </span>

          <p id="feedback-text"></p>

        </div>



        <!-- NEXT -->

        <button
          type="button"
          class="practice-button"
          id="next-button"
          disabled>

          <span id="next-button-text">
            Soal Berikutnya
          </span>

          <span>
            →
          </span>

        </button>

      </div>

    </section>



    <!-- ===================================================
         SELESAI
         =================================================== -->

    <section
      class="practice-finish"
      id="practice-finish">

      <div class="finish-card">

        <div class="finish-icon">
          ✓
        </div>


        <p class="section-label">
          LATIHAN SELESAI
        </p>


        <h2>
          Kamu sudah siap untuk kuis!
        </h2>


        <p id="finish-text">
          Sekarang waktunya menguji pemahamanmu.
        </p>


        <a
          href="quiz.html"
          class="finish-button"
          id="quiz-button">

          <span>
            Mulai Kuis
          </span>

          <span>
            →
          </span>

        </a>

      </div>

    </section>

  </main>



  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="footer">

    <p>
      © 2026 EduRush
    </p>

  </footer>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="./js/latihan.js"></script>

</body>

</html>
