<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pilih Materi — EduRush</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="navbar">

    <a href="index.html" class="logo">

      <span class="logo-icon">✦</span>

      <span>
        EduRush
      </span>

    </a>

    <nav class="nav-menu">

      <a href="index.html">
        Beranda
      </a>

      <a href="index.html#tentang">
        Tentang
      </a>

    </nav>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="setup-page">

    <section class="setup-container">


      <!-- =========================
           HEADING
      ========================== -->

      <div class="setup-heading">

        <div class="setup-label">
          ✦ MATEMATIKA
        </div>

        <h1>
          Pilih materi
          <span>belajarmu.</span>
        </h1>

        <p>
          Pilih materi Matematika yang ingin kamu pelajari,
          lalu lanjutkan ke pembelajaran.
        </p>

       </div>


      <!-- =========================
           MATERIAL BOX
      ========================== -->

      <div class="setup-box">

        <div class="setup-box-title">

          <span class="number">
            01
          </span>

          <div>

            <h2>
              Materi Matematika
            </h2>

            <p>
              Pilih salah satu materi untuk mulai belajar.
            </p>

          </div>

        </div>


        <!-- =========================
             MATERIAL LIST
        ========================== -->

        <div class="material-list">


          <!-- MATERI 1 -->

          <button
            class="material-card active"
            type="button"
            data-material="Bilangan"
          >

            <div class="material-icon">
              1
            </div>

            <div class="material-info">

              <h3>
                Bilangan
              </h3>

              <p>
                Mengenal bilangan dan konsep dasarnya.
              </p>

            </div>

            <span class="material-arrow">
              →
            </span>

          </button>


          <!-- MATERI 2 -->

          <button
            class="material-card"
            type="button"
            data-material="Operasi Hitung"
          >

            <div class="material-icon">
              +
            </div>

            <div class="material-info">

              <h3>
                Operasi Hitung
              </h3>

              <p>
                Mengenal penjumlahan, pengurangan,
                perkalian, dan pembagian.
              </p>

            </div>

            <span class="material-arrow">
              →
            </span>

          </button>


          <!-- MATERI 3 -->

          <button
            class="material-card"
            type="button"
            data-material="Bangun Datar"
          >

            <div class="material-icon">
              □
            </div>

            <div class="material-info">

              <h3>
                Bangun Datar
              </h3>

              <p>
                Mengenal bentuk dan ciri-ciri
                bangun datar.
              </p>

            </div>

            <span class="material-arrow">
              →
            </span>

          </button>


        </div>


        <!-- =========================
             BUTTON
        ========================== -->

        <button
          class="setup-button"
          id="continueButton"
          type="button"
        >

          Mulai Belajar

          <span>
            →
          </span>

        </button>

      </div>


      <!-- =========================
           NOTE
      ========================== -->

      <div class="setup-note">

        <span>
          ✦
        </span>

        <p>
          Pilihan materi dapat disesuaikan dengan
          kebutuhan pembelajaran.
        </p>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <p>
      © 2026 EduRush
    </p>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    const materialCards =
      document.querySelectorAll(".material-card");

    const continueButton =
      document.getElementById("continueButton");


    let selectedMaterial = "Bilangan";


    /* =========================
       PILIH MATERI
    ========================== */

    materialCards.forEach(card => {

      card.addEventListener("click", () => {

        materialCards.forEach(item => {

          item.classList.remove("active");

        });

        card.classList.add("active");

        selectedMaterial =
          card.dataset.material;

      });

    });


    /* =========================
       MULAI BELAJAR
    ========================== */

    continueButton.addEventListener("click", () => {

      localStorage.setItem(
        "edurush_material",
        selectedMaterial
      );

      window.location.href =
        "belajar.html";

    });

  </script>

</body>

</html>
