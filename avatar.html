<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduRush — Avatar Creator</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Inter,Arial,sans-serif;
  color:#292724;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 15% 10%,
      #fff7df 0,
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 90%,
      #d9eff0 0,
      transparent 35%
    ),
    #f3f0e9;
}


/* =========================================
   APP
========================================= */

.app{
  width:100%;
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1fr) 370px;
  gap:22px;
  padding:22px;
}


/* =========================================
   PREVIEW
========================================= */

.preview{
  position:relative;
  min-height:calc(100vh - 44px);
  overflow:hidden;

  border-radius:34px;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(255,255,255,.95),
      rgba(255,255,255,.45) 28%,
      transparent 55%
    ),
    linear-gradient(
      145deg,
      #e6f1ed,
      #d7e7e4
    );

  box-shadow:
    0 25px 70px rgba(40,48,45,.12),
    inset 0 1px rgba(255,255,255,.9);
}


#scene{
  position:absolute;
  inset:0;
}


.preview-header{
  position:absolute;
  top:30px;
  left:34px;
  z-index:10;
}


.preview-header small{
  display:block;
  font-size:11px;
  font-weight:900;
  letter-spacing:.2em;
  opacity:.4;
}


.preview-header h1{
  margin:5px 0 0;
  font-size:30px;
  letter-spacing:-.05em;
}


.preview-hint{
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);

  z-index:10;

  padding:10px 17px;

  border-radius:999px;

  background:rgba(255,255,255,.62);
  backdrop-filter:blur(14px);

  font-size:12px;
  font-weight:800;

  white-space:nowrap;

  opacity:.65;
}


/* =========================================
   PANEL
========================================= */

.panel{
  min-height:calc(100vh - 44px);
  max-height:calc(100vh - 44px);

  overflow-y:auto;

  padding:25px;

  border-radius:30px;

  background:rgba(255,255,255,.86);

  backdrop-filter:blur(22px);

  border:1px solid rgba(255,255,255,.8);

  box-shadow:
    0 20px 60px rgba(40,48,45,.10);
}


.panel::-webkit-scrollbar{
  width:5px;
}

.panel::-webkit-scrollbar-thumb{
  background:#d6d2ca;
  border-radius:20px;
}


.panel h2{
  margin:0;

  font-size:25px;

  letter-spacing:-.05em;
}


.subtitle{
  margin:7px 0 25px;

  font-size:13px;

  line-height:1.5;

  opacity:.5;
}


/* =========================================
   SECTION
========================================= */

.section{
  margin-bottom:23px;
}


.section-title{
  margin-bottom:10px;

  font-size:11px;

  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.14em;

  opacity:.42;
}


.options{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;
}


/* =========================================
   BUTTON
========================================= */

.option{
  border:0;

  min-height:43px;

  padding:10px 7px;

  border-radius:15px;

  background:#f0eee9;

  color:#292724;

  font-family:inherit;

  font-size:11px;

  font-weight:850;

  cursor:pointer;

  transition:
    transform .18s ease,
    background .18s ease,
    color .18s ease,
    box-shadow .18s ease;
}


.option:hover{
  transform:translateY(-2px);

  background:#e5e2db;
}


.option.active{
  color:white;

  background:#292724;

  box-shadow:
    0 8px 20px rgba(41,39,36,.18);
}


/* =========================================
   COLOR
========================================= */

.color{
  width:100%;
  height:43px;

  padding:0;

  border-radius:14px;

  border:3px solid transparent;

  cursor:pointer;

  transition:.18s ease;
}


.color:hover{
  transform:scale(1.04);
}


.color.active{
  border-color:#292724;

  box-shadow:
    0 0 0 3px white,
    0 5px 14px rgba(0,0,0,.12);
}


/* =========================================
   SAVE
========================================= */

.save{
  width:100%;

  margin-top:2px;

  padding:16px;

  border:0;

  border-radius:17px;

  background:#292724;

  color:white;

  font-family:inherit;

  font-size:14px;

  font-weight:900;

  cursor:pointer;

  transition:.2s ease;
}


.save:hover{
  transform:translateY(-2px);

  box-shadow:
    0 12px 30px rgba(41,39,36,.2);
}


.saved{
  height:18px;

  margin-top:9px;

  text-align:center;

  font-size:12px;

  font-weight:800;

  opacity:0;

  transition:.2s ease;
}


.saved.show{
  opacity:.55;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:900px){

  .app{
    grid-template-columns:1fr;

    padding:12px;
  }

  .preview{
    min-height:70vh;
  }

  .panel{
    min-height:auto;
    max-height:none;
  }

}

</style>
</head>

<script type="importmap">

{
  "imports": {

    "three":
    "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",

    "three/addons/":

<script type="module">

import * as THREE from "three";

import {
  OrbitControls
}
from "three/addons/controls/OrbitControls.js";



/* =========================================
   ELEMENT
========================================= */

const container =
  document.getElementById("scene");



/* =========================================
   SCENE
========================================= */

const scene =
  new THREE.Scene();


scene.background =
  new THREE.Color(0xdcebe6);



/* =========================================
   CAMERA
========================================= */

const camera =
  new THREE.PerspectiveCamera(

    32,

    container.clientWidth /
    container.clientHeight,

    .1,

    100

  );


camera.position.set(
  0,
  .5,
  7
);



/* =========================================
   RENDERER
========================================= */

const renderer =
  new THREE.WebGLRenderer({

    antialias:true,

    alpha:true

  });


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);


renderer.setSize(

  container.clientWidth,

  container.clientHeight

);


renderer.shadowMap.enabled =
  true;


renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;


container.appendChild(
  renderer.domElement
);



/* =========================================
   CONTROLS
========================================= */

const controls =
  new OrbitControls(

    camera,

    renderer.domElement

  );


controls.enableDamping =
  true;


controls.dampingFactor =
  .07;


controls.enablePan =
  false;


controls.minDistance =
  5;


controls.maxDistance =
  8;


controls.minPolarAngle =
  Math.PI / 2.4;


controls.maxPolarAngle =
  Math.PI / 1.75;



/* =========================================
   LIGHTS
========================================= */

const hemi =
  new THREE.HemisphereLight(

    0xffffff,

    0x9db2aa,

    2.4

  );


scene.add(hemi);



const key =
  new THREE.DirectionalLight(

    0xffffff,

    3.5

  );


key.position.set(
  -4,
  7,
  5
);


key.castShadow =
  true;


key.shadow.mapSize.width =
  2048;


key.shadow.mapSize.height =
  2048;


scene.add(key);



const fill =
  new THREE.DirectionalLight(

    0xffffff,

    1.4

  );


fill.position.set(
  4,
  3,
  -4
);


scene.add(fill);



/* =========================================
   FLOOR
========================================= */

const floor =
  new THREE.Mesh(

    new THREE.CircleGeometry(
      3.2,
      64
    ),

    new THREE.MeshStandardMaterial({

      color:0xc7d8d1,

      roughness:.95

    })

  );


floor.rotation.x =
  -Math.PI / 2;


floor.position.y =
  -2.0;


floor.receiveShadow =
  true;


scene.add(floor);



/* =========================================
   STATE
========================================= */

const state = {

  skin:"#D99A72",

  face:"cute",

  outfit:"hoodie",

  outfitColor:"#E86F61",

  accessory:"none"

};



let character = null;



/* =========================================
   MATERIAL
========================================= */

function mat(
  color,
  roughness=.78
){

  return new THREE.MeshStandardMaterial({

    color:new THREE.Color(color),

    roughness:roughness,

    metalness:0

  });

}



/* =========================================
   SPHERE
========================================= */

function sphere(
  radius,
  color
){

  const mesh =
    new THREE.Mesh(

      new THREE.SphereGeometry(

        radius,

        40,

        32

      ),

      mat(color)

    );


  mesh.castShadow =
    true;


  mesh.receiveShadow =
    true;


  return mesh;

}



/* =========================================
   CAPSULE
========================================= */

function capsule(
  radius,
  length,
  color
){

  const mesh =
    new THREE.Mesh(

      new THREE.CapsuleGeometry(

        radius,

        length,

        12,

        24

      ),

      mat(color)

    );


  mesh.castShadow =
    true;


  mesh.receiveShadow =
    true;


  return mesh;

}



/* =========================================
   BUILD CHARACTER
========================================= */

function buildCharacter(){

  if(character){

    scene.remove(
      character
    );

  }


  character =
    new THREE.Group();


  /* =======================================
     BODY
  ======================================= */

  const body =
    capsule(

      .76,

      .40,

      state.outfitColor

    );


  body.position.set(
    0,
    -.50,
    0
  );


  body.scale.set(
    1,
    1.0,
    .83
  );


  character.add(body);



  /* =======================================
     HEAD
  ======================================= */

  const head =
    sphere(

      .92,

      state.skin

    );


  head.position.set(
    0,
    1.02,
    0
  );


  head.scale.set(
    1.07,
    1.08,
    1
  );


  character.add(head);



  /* =======================================
     EARS
  ======================================= */

  const earL =
    sphere(
      .19,
      state.skin
    );


  earL.position.set(
    -.89,
    1.02,
    0
  );


  character.add(
    earL
  );


  const earR =
    sphere(
      .19,
      state.skin
    );


  earR.position.set(
    .89,
    1.02,
    0
  );


  character.add(
    earR
  );



  /* =======================================
     ARMS
  ======================================= */

  const armL =
    capsule(

      .22,

      .70,

      state.outfitColor

    );


  armL.position.set(
    -.91,
    -.50,
    0
  );


  armL.rotation.z =
    -.12;


  character.add(
    armL
  );


  const armR =
    capsule(

      .22,

      .70,

      state.outfitColor

    );


  armR.position.set(
    .91,
    -.50,
    0
  );


  armR.rotation.z =
    .12;


  character.add(
    armR
  );



  /* =======================================
     HANDS
  ======================================= */

  const handL =
    sphere(
      .25,
      state.skin
    );


  handL.position.set(
    -.98,
    -1.02,
    0
  );


  character.add(
    handL
  );


  const handR =
    sphere(
      .25,
      state.skin
    );


  handR.position.set(
    .98,
    -1.02,
    0
  );


  character.add(
    handR
  );



  /* =======================================
     LEGS
  ======================================= */

  const legL =
    capsule(

      .27,

      .58,

      "#363331"

    );


  legL.position.set(
    -.36,
    -1.30,
    0
  );


  character.add(
    legL
  );


  const legR =
    capsule(

      .27,

      .58,

      "#363331"

    );


  legR.position.set(
    .36,
    -1.30,
    0
  );


  character.add(
    legR
  );



  /* =======================================
     SHOES
  ======================================= */

  const shoeL =
    sphere(
      .34,
      "#F5F1E8"
    );


  shoeL.scale.set(
    1.25,
    .62,
    1.55
  );


  shoeL.position.set(
    -.36,
    -1.73,
    .10
  );


  character.add(
    shoeL
  );


  const shoeR =
    sphere(
      .34,
      "#F5F1E8"
    );


  shoeR.scale.set(
    1.25,
    .62,
    1.55
  );


  shoeR.position.set(
    .36,
    -1.73,
    .10
  );


  character.add(
    shoeR
  );



  createFace();

  createOutfit();

  createAccessory();



  scene.add(
    character
  );

}



/* =========================================
   FACE
========================================= */

function createFace(){

  const eyeMaterial =
    mat(
      "#292624",
      .5
    );


  let eyeY =
    1;


  if(
    state.face === "sleepy"
  ){

    eyeY =
      .35;

  }


  /* EYE LEFT */

  const eyeL =
    sphere(
      .075,
      "#292624"
    );


  eyeL.scale.y =
    eyeY;


  eyeL.position.set(
    -.30,
    1.10,
    .88
  );


  character.add(
    eyeL
  );



  /* EYE RIGHT */

  const eyeR =
    sphere(
      .075,
      "#292624"
    );


  eyeR.scale.y =
    eyeY;


  eyeR.position.set(
    .30,
    1.10,
    .88
  );


  character.add(
    eyeR
  );



  /* NOSE */

  const nose =
    sphere(
      .055,
      "#B56F51"
    );


  nose.position.set(
    0,
    .98,
    .90
  );


  character.add(
    nose
  );



  /* MOUTH */

  const mouth =
    new THREE.Mesh(

      new THREE.TorusGeometry(

        .10,

        .025,

        8,

        20,

        Math.PI

      ),

      eyeMaterial

    );


  mouth.rotation.x =
    Math.PI;


  mouth.position.set(
    0,
    .82,
    .90
  );


  character.add(
    mouth
  );



  /* BLUSH */

  if(
    state.face === "cute" ||
    state.face === "happy"
  ){

    const blushL =
      sphere(
        .09,
        "#EF9B91"
      );


    blushL.scale.set(
      1.5,
      .55,
      .25
    );


    blushL.position.set(
      -.48,
      .94,
      .86
    );


    character.add(
      blushL
    );


    const blushR =
      blushL.clone();


    blushR.position.x =
      .48;


    character.add(
      blushR
    );

  }

}



/* =========================================
   OUTFIT
========================================= */

function createOutfit(){

  /* HOODIE */

  if(
    state.outfit === "hoodie"
  ){

    const hood =
      sphere(
        .70,
        state.outfitColor
      );


    hood.scale.set(
      1.08,
      .72,
      .66
    );


    hood.position.set(
      0,
      .20,
      -.28
    );


    character.add(
      hood
    );


    const cordL =
      capsule(
        .018,
        .28,
        "#F5F1E8"
      );


    cordL.position.set(
      -.11,
      .10,
      .65
    );


    character.add(
      cordL
    );


    const cordR =
      capsule(
        .018,
        .28,
        "#F5F1E8"
      );


    cordR.position.set(
      .11,
      .10,
      .65
    );


    character.add(
      cordR
    );

  }



  /* JACKET */

  if(
    state.outfit === "jacket"
  ){

    const stripe =
      capsule(
        .07,
        .95,
        "#F5F1E8"
      );


    stripe.rotation.z =
      Math.PI / 2;


    stripe.scale.x =
      1.8;


    stripe.position.set(
      0,

  function roundedBox(
    width,
    height,
    depth,
    color,
    radius = 0.12
  ){

    const shape =
      new THREE.Shape();

    const w = width / 2;
    const h = height / 2;
    const r = Math.min(radius, w, h);

    shape.moveTo(-w + r, -h);
    shape.lineTo(w - r, -h);

    shape.quadraticCurveTo(
      w,
      -h,
      w,
      -h + r
    );

    shape.lineTo(
      w,
      h - r
    );

    shape.quadraticCurveTo(
      w,
      h,
      w - r,
      h
    );

    shape.lineTo(
      -w + r,
      h
    );

    shape.quadraticCurveTo(
      -w,
      h,
      -w,
      h - r
    );

    shape.lineTo(
      -w,
      -h + r
    );

    shape.quadraticCurveTo(
      -w,
      -h,
      -w + r,
      -h
    );

    const geo =
      new THREE.ExtrudeGeometry(
        shape,
        {
          depth: depth,
          bevelEnabled: true,
          bevelSegments: 4,
          bevelSize: 0.04,
          bevelThickness: 0.04,
          curveSegments: 8
        }
      );

    geo.center();

    const mesh =
      new THREE.Mesh(
        geo,
        mat(color)
      );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
  }


  function torus(
    radius,
    tube,
    color
  ){

    const mesh =
      new THREE.Mesh(

        new THREE.TorusGeometry(
          radius,
          tube,
          18,
          64
        ),

        mat(color)
      );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
  }

/* =========================================
   BUTTON SYSTEM
========================================= */

document
.querySelectorAll(
  "[data-type]"
)
.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      const type =
        button.dataset.type;


      const value =
        button.dataset.value;


      state[type] =
        value;


      document
      .querySelectorAll(
        `[data-type="${type}"]`
      )
      .forEach(
        item => {

          item.classList.remove(
            "active"
          );

        }
      );


      button.classList.add(
        "active"
      );


      buildCharacter();

    }
  );

});



/* =========================================
   SAVE
========================================= */

document
.getElementById(
  "saveAvatar"
)
.addEventListener(
  "click",
  () => {

    localStorage.setItem(
      "edurush_avatar",
      JSON.stringify(state)
    );


    const saved =
      document.getElementById(
        "saved"
      );


    saved.classList.add(
      "show"
    );


    setTimeout(
      () => {

        saved.classList.remove(
          "show"
        );

      },
      1800
    );

  }
);



/* =========================================
   LOAD
========================================= */

const saved =
  localStorage.getItem(
    "edurush_avatar"
  );


if(saved){

  try{

    const data =
      JSON.parse(saved);


    Object.assign(
      state,
      data
    );


    document
    .querySelectorAll(
      "[data-type]"
    )
    .forEach(
      button => {

        const type =
          button.dataset.type;


        const value =
          button.dataset.value;


        if(
          state[type] === value
        ){

          document
          .querySelectorAll(
            `[data-type="${type}"]`
          )
          .forEach(
            x =>
              x.classList.remove(
                "active"
              )
          );


          button.classList.add(
            "active"
          );

        }

      }
    );

  }
  catch(error){

    console.log(
      "Avatar lama tidak dapat dibaca."
    );

  }

}



/* =========================================
   RESIZE
========================================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      container.clientWidth /
      container.clientHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      container.clientWidth,

      container.clientHeight

    );

  }
);



/* =========================================
   ANIMATION
========================================= */

const clock =
  new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  const time =
    clock.getElapsedTime();


  if(character){

    /* idle animation */

    character.position.y =
      Math.sin(
        time * 1.5
      ) * .025;

  }


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


buildCharacter();

animate();
