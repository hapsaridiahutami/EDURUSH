
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pilih Game — EduRush</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --dark: #173d2c;
      --green: #087443;
      --green-dark: #055b35;
      --soft-green: #e8f3ec;
      --text: #68766f;
      --line: #dce9e1;
      --bg: #f7f9f4;
      --yellow: #ffc928;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--dark);
      font-family: "Outfit", sans-serif;
    }

    /* HEADER */

    .game-header {
      min-height: 76px;
      padding: 0 clamp(20px, 5vw, 70px);

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);

      position: sticky;
      top: 0;
      z-index: 20;
    }

    .game-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      color: var(--dark);
      text-decoration: none;

      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 22px;
      font-weight: 800;
    }

    .game-logo-mark {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      background: var(--green);
      color: white;

      font-size: 13px;
      font-weight: 800;

      box-shadow: 0 7px 18px rgba(8, 116, 67, 0.16);
    }

    /* MAIN */

    .game-main {
      width: min(1120px, calc(100% - 44px));
      margin: 0 auto;
      padding: 55px 0 85px;
    }

    .intro {
      max-width: 760px;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;

      padding: 7px 12px;

      border-radius: 999px;

      background: var(--soft-green);
      color: #18734a;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
    }

    .game-title {
      margin: 15px 0 0;

      color: var(--dark);

      font-family: "Bricolage Grotesque", sans-serif;
      font-size: clamp(42px, 5vw, 58px);
      font-weight: 800;

      line-height: 1.04;
      letter-spacing: -1.5px;
    }

    .game-subtitle {
      max-width: 650px;
      margin: 14px 0 0;

      color: var(--text);

      font-size: 15px;
      line-height: 1.6;
    }

    /* GRID */

    .games-grid {
      display: grid;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 22px;

      margin-top: 38px;
    }

    /* CARD */

    .game-card {
      position: relative;

      min-height: 310px;
      padding: 27px;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background: white;

      border: 1px solid var(--line);
      border-radius: 25px;

      color: inherit;
      text-decoration: none;

      box-shadow: 0 12px 30px rgba(5, 91, 53, 0.06);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .game-card::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      right: -65px;
      top: -65px;

      border-radius: 50%;

      background: #f5f7f4;

      transition:
        transform 0.3s ease,
        background 0.3s ease;
    }

    .game-card:hover {
      transform: translateY(-7px);

      border-color: #a9cdb8;

      box-shadow: 0 20px 42px rgba(5, 91, 53, 0.12);
    }

    .game-card:hover::before {
      transform: scale(1.15);
      background: #edf4ef;
    }

    /* ICON */

    .game-icon {
      position: relative;
      z-index: 2;

      width: 62px;
      height: 62px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      font-size: 30px;

      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
    }

    .quiz-icon {
      background: #fff0df;
    }

    .run-icon {
      background: #fff1c9;
    }

    .adventure-icon {
      background: #e8f4ff;
    }

    .mission-icon {
      background: #eaf6ef;
    }

    /* NUMBER */

    .game-number {
      position: absolute;

      right: 24px;
      top: 22px;

      color: #d9e4dd;

      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 48px;
      font-weight: 800;

      line-height: 1;
    }

    /* CONTENT */

    .game-content {
      position: relative;
      z-index: 2;

      margin-top: auto;
    }

    .game-tag {
      width: fit-content;

      margin-bottom: 10px;
      padding: 6px 10px;

      border-radius: 999px;

      background: #f0f5f1;
      color: #52806a;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.7px;
    }

    .game-card h2 {
      margin: 0;

      color: var(--dark);

      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 29px;
      font-weight: 800;

      line-height: 1.1;
    }

    .game-card p {
      max-width: 460px;

      margin: 9px 0 0;

      color: var(--text);

      font-size: 14px;
      line-height: 1.5;
    }

    /* BUTTON */

    .game-play {
      width: fit-content;

      display: inline-flex;
      align-items: center;
      gap: 9px;

      margin-top: 20px;
      padding: 10px 15px;

      border-radius: 12px;

      background: #f2f7f3;
      color: var(--green);

      font-size: 13px;
      font-weight: 800;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .game-play span {
      transition: transform 0.2s ease;
    }

    .game-card:hover .game-play {
      background: var(--green);
      color: white;
    }

    .game-card:hover .game-play span {
      transform: translateX(4px);
    }

    /* MISSION CARD */

    .mission-card {
      border-color: #d8e9df;
    }

    .mission-card:hover {
      border-color: #9ac7ae;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .game-header {
        min-height: 68px;
        padding: 0 18px;
      }

      .game-logo {
        font-size: 19px;
      }

      .game-logo-mark {
        width: 36px;
        height: 36px;
      }

      .game-main {
        width: min(100% - 28px, 560px);
        padding-top: 40px;
      }

      .game-title {
        font-size: 38px;
        letter-spacing: -1px;
      }

      .game-subtitle {
        font-size: 13px;
      }

      .games-grid {
        grid-template-columns: 1fr;
        gap: 16px;
        margin-top: 30px;
      }

      .game-card {
        min-height: 270px;
        padding: 23px;
      }

      .game-number {
        font-size: 40px;
        right: 18px;
        top: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="game-header">

    <a href="index.html" class="game-logo">
      <span class="game-logo-mark">ER</span>
      EduRush
    </a>

    <div
      class="setup-pills"
      data-setup-pills
    ></div>

  </header>


  <!-- MAIN -->

  <main class="game-main">

    <section class="intro">

      <span class="step-badge">
        LANGKAH 2
      </span>

      <h1 class="game-title">
        Pilih mini-game
      </h1>

      <p class="game-subtitle">
        Pilih tantangan yang kamu mau.
        Jawab soal, kumpulkan XP, dan terus maju
        sampai kamu jadi jagoan EduRush.
      </p>

    </section>



<!-- GAME GRID -->
<section class="games-grid">

  <!-- game 1 -->
  <a href="adventure.html" class="game-card">
    
    <span class="game-number">01</span>

    <div class="game-icon adventure-icon">
      🌎
    </div>

    <div class="game-content">
      <div class="game-tag">
        ADVENTURE
      </div>

      <h2>
        Adventure World
      </h2>

      <p>
        Jelajahi dunia 3D, temukan berbagai area,
        dan jawab tantangan pembelajaran sambil terus maju.
      </p>

      <div class="game-play">
        Mulai Adventure
        <span>→</span>
      </div>
    </div>

  </a>

</section>

  </main>


  <!-- APP -->

  <script src="js/app.js"></script>

  <script>

    const setup = EduRush.requireSetup();

    if (setup) {

      EduRush.renderSetupPills(
        document.querySelector("[data-setup-pills]")
      );

    }

  </script>

</body>
</html>
