<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hasil — EduRush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Lewati ke konten</a>
    <header class="site-header">
      <a class="logo" href="index.html"><span class="logo-mark">ER</span> EduRush</a>
      <div class="header-meta" data-setup-pills></div>
    </header>
    <main id="main" class="wrap">
      <p class="kicker">Session drop</p>
      <h1 class="section-title" id="title">Hasil</h1>
      <div class="play-layout">
        <aside class="preview-stage" id="avatar-stage"></aside>
        <div>
          <p class="result-score" id="score">0</p>
          <div class="result-grid">
            <div class="stat"><b id="correct">0</b><span>Benar</span></div>
            <div class="stat"><b id="wrong">0</b><span>Salah</span></div>
            <div class="stat"><b id="streak">0</b><span>Streak max</span></div>
          </div>
          <div class="btn-row">
            <a class="btn btn-primary" id="again" href="games.html">Run it back</a>
            <a class="btn btn-secondary" href="games.html">Ganti game</a>
            <a class="btn btn-ghost" href="setup.html">Ganti world</a>
          </div>
        </div>
      </div>
    </main>
    <script src="js/avatar.js"></script>
    <script src="js/app.js"></script>
    <script>
      EduRush.renderSetupPills(document.querySelector("[data-setup-pills]"));
      const avatar = EduRushAvatar.getAvatar();
      const stage = document.getElementById("avatar-stage");
      const result = EduRush.getResult();
      EduRushAvatar.renderAvatar(stage, avatar, 180);
      const nm = document.createElement("p");
      nm.className = "avatar-name";
      nm.textContent = avatar.name;
      stage.appendChild(nm);
      if (!result) {
        document.getElementById("title").textContent = "Belum ada sesi";
        document.querySelector(".btn-row").innerHTML =
          '<a class="btn btn-primary" href="avatar.html">Start from avatar</a>';
      } else {
        document.body.classList.add("world-" + result.jenjang);
        document.getElementById("title").textContent = result.gameName;
        document.getElementById("score").textContent = result.score;
        document.getElementById("correct").textContent = `${result.correct}/${result.total}`;
        document.getElementById("wrong").textContent = result.wrong;
        document.getElementById("streak").textContent = result.bestStreak || 0;
        document.getElementById("again").href = `play.html?game=${result.gameId}`;
        const ratio = result.total ? result.correct / result.total : 0;
        EduRushAvatar.setAvatarMood(stage, ratio >= 0.6 ? "win" : "lose");
      }
    </script>
  </body>
</html>
